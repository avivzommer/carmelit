<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Haifa Underground · Mobile station level</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: radial-gradient(ellipse at 50% 58%, #e5d9b7 0%, #95b5ae 23%, #477b82 49%, #254b60 78%, #183548 100%); }
    body::before { content: ""; position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 55%, #263a42 0%, #142831 52%, #09151e 100%); opacity: var(--underground-depth, 0); pointer-events: none; }
    body::after { content: ""; position: fixed; inset: 0; background: #dbe3d3; opacity: 0; pointer-events: none; transition: opacity .7s; }
    body.departing::after { opacity: 1; z-index: 10; }
    canvas { position: relative; display: block; width: 100%; height: 100%; }
    #error { position: absolute; inset: 40% 15%; color: #fff; font: 16px/1.6 system-ui; text-align: center; }
    #controls { position: fixed; top: 20px; right: 22px; }
    .level-link { color: #fff4d6; font: 12px system-ui; margin-right: 14px; text-decoration: none; }
    button { color: #fff4d6; background: #243e5c55; border: 1px solid #fff2; border-radius: 24px; padding: 10px 17px; font: 12px system-ui; cursor: pointer; backdrop-filter: blur(10px); }
    button:hover, button:focus-visible { background: #243e5caa; outline: 2px solid #ffe2a0; outline-offset: 3px; }
    #status { position: fixed; bottom: 24px; left: 20px; right: 20px; margin: 0; color: #fff6df; text-align: center; font: 13px/1.5 system-ui; letter-spacing: .025em; text-shadow: 0 1px 8px #183353; pointer-events: none; }
    #win { position: fixed; inset: 0; background: #142c4366; backdrop-filter: blur(5px); display: grid; place-content: center; text-align: center; color: #fff1cd; font: 16px system-ui; }
    #win[hidden] { display: none; }
    #win h1 { font: 400 38px Georgia, serif; margin-bottom: 10px; }
    #win p { margin: 0 0 28px; opacity: .85; }
    @media (prefers-reduced-motion: reduce) { #win { backdrop-filter: none; } }
  </style>
  <link rel="stylesheet" href="./game-layout.css">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<link rel="stylesheet" href="./mobile-prototype.css">
</head>
<body data-chapter="2">
  <canvas id="scene" aria-label="Mobile station level. Tap floors to explore, repair cabinets, turn platform wheels, and use cabin controls. Overview shows the station. Restart repeats the journey."></canvas>
  <div id="repair-progress" aria-label="Repair progress"><span aria-label="Repair 1: pending">▲</span><span aria-label="Repair 2: pending">■</span><span aria-label="Repair 3: pending">●</span></div>
  <div id="controls"><button id="overview" aria-pressed="false">Overview</button><button id="help">Hint</button> <button id="restart" title="Restart (R)">Restart</button></div>
  <p id="status" role="status" aria-live="polite"></p>
  <div id="win" hidden role="dialog" aria-modal="true" aria-labelledby="win-title"><h1 id="win-title">Level complete.</h1><p>Power restored. The line is running again.</p><button id="again">Play again</button><a class="level-link" style="margin-top:20px" href="./index.html">Return to station</a></div>
  <div id="machine-markers" aria-label="Station machinery"></div>
<section id="wheel-dial" hidden aria-label="Cable haul wheel">
 <button id="wheel-close" aria-label="Leave wheel">×</button>
 <div id="wheel-position" role="status">Cable haul wheel</div>
 <div id="dial-face" aria-label="Drag around the wheel to move the carts"><svg viewBox="0 0 120 120" aria-hidden="true"><g id="dial-rotor"><circle cx="60" cy="60" r="43"/><path d="M60 17V103M17 60H103"/><circle class="hub" cx="60" cy="60" r="9"/><circle class="grip" cx="101" cy="60" r="7"/></g></svg></div>
 <div class="wheel-keys"><button id="wheel-back" aria-label="Turn wheel counterclockwise">↶</button><span>Turn to haul<br>Release at a stop</span><button id="wheel-forward" aria-label="Turn wheel clockwise">↷</button></div>
</section>
<script type="module" src="./mobile-prototype.js"></script>
</body>
</html>
