<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Haifa Underground · Mobile station level</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: radial-gradient(ellipse at 50% 58%, #e5d9b7 0%, #95b5ae 23%, #477b82 49%, #254b60 78%, #183548 100%); }
    body::before { content: ""; position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 55%, #263a42 0%, #142831 52%, #09151e 100%); opacity: var(--underground-depth, 0); pointer-events: none; }
    body::after { content: ""; position: fixed; inset: 0; background: #dbe3d3; opacity: 0; pointer-events: none; transition: opacity .7s; }
    body.departing::after { opacity: 1; z-index: 10; }
    canvas { position: relative; display: block; width: 100%; height: 100%; }
    #error { position: absolute; inset: 40% 15%; color: #fff; font: 16px/1.6 system-ui; text-align: center; }
    #controls { position: fixed; top: 20px; right: 22px; }
    .level-link { color: #fff4d6; font: 12px system-ui; margin-right: 14px; text-decoration: none; }
    button { color: #fff4d6; background: #243e5c55; border: 1px solid #fff2; border-radius: 24px; padding: 10px 17px; font: 12px system-ui; cursor: pointer; backdrop-filter: blur(10px); }
    button:hover, button:focus-visible { background: #243e5caa; outline: 2px solid #ffe2a0; outline-offset: 3px; }
    #status { position: fixed; bottom: 24px; left: 20px; right: 20px; margin: 0; color: #fff6df; text-align: center; font: 13px/1.5 system-ui; letter-spacing: .025em; text-shadow: 0 1px 8px #183353; pointer-events: none; }
    #win { position: fixed; inset: 0; background: #142c4366; backdrop-filter: blur(5px); display: grid; place-content: center; text-align: center; color: #fff1cd; font: 16px system-ui; }
    #win[hidden] { display: none; }
    #win h1 { font: 400 38px Georgia, serif; margin-bottom: 10px; }
    #win p { margin: 0 0 28px; opacity: .85; }
    @media (prefers-reduced-motion: reduce) { #win { backdrop-filter: none; } }
  </style>
  <link rel="stylesheet" href="./game-layout.css?icon-intro=1">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<link rel="stylesheet" href="./mobile-prototype.css?single-indicator=1">
</head>
<body data-chapter="2">
  <canvas id="scene" aria-label="Mobile station level. Tap floors to explore, repair cabinets, turn the upper left wheel, and swipe up or down inside a cart or use cabin controls. Overview shows the station. Restart repeats the journey."></canvas>
  <div id="repair-progress" aria-label="Repair progress">
    <span aria-label="Repair 1: pending"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 22 21H2Z"/></svg></span>
    <span aria-label="Repair 2: pending"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="1"/></svg></span>
    <span aria-label="Repair 3: pending"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/></svg></span>
  </div>
  <div id="controls">
    <button id="overview" aria-label="Overview" aria-pressed="false" title="Overview">
      <svg class="overview-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg>
      <svg class="focus-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h5V3m13 5h-5V3M8 21v-5H3m13 5v-5h5"/></svg>
      <span class="overview-icon">Overview</span><span class="focus-icon">Back</span>
    </button>
    <button id="help" aria-label="Gameplay tips" aria-pressed="false" title="Gameplay tips"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 8a2.5 2.5 0 0 1 5 0c0 2-2.5 2-2.5 4m0 4h.01"/></svg><span>Tips</span></button>
    <button id="restart" aria-label="Restart" title="Restart (R)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10a8 8 0 1 0-1.8 7.2M20 4v6h-6"/></svg><span>Restart</span></button>
  </div>
  <p id="status" role="status" aria-live="polite"></p>
  <div id="win" hidden role="dialog" aria-modal="true" aria-labelledby="win-title"><section class="station-dialog"><span class="dialog-brand">Carmelit / Line restored</span><h1 id="win-title">Level complete.</h1><p>Power restored. The line is running again.</p><button id="again">Play again</button><a class="level-link" href="./index.html">Return to station</a></section></div>
<script type="module" src="./mobile-prototype.js?single-indicator=1"></script>
</body>
</html>
